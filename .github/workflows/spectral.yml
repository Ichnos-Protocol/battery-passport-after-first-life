# Lints the OpenAPI file with Spectral on a change of docs/api/ or of .spectral.yaml.
# Process requirement: PrR-CXD-030 (OpenAPI file linted with Spectral on every change).
name: OpenAPI lint

on:
  pull_request:
    paths:
      - "docs/api/**"
      - ".spectral.yaml"
  push:
    branches:
      - main
    paths:
      - "docs/api/**"
      - ".spectral.yaml"

permissions:
  contents: read

jobs:
  spectral:
    name: The Spectral lint of docs/api/openAPI.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Lint the OpenAPI file
        run: npx @stoplight/spectral-cli@6 lint docs/api/openAPI.yaml --ruleset .spectral.yaml --fail-severity error
