# Validates the three proposed aspect models with the SAMM command line tool 2.11.1 and compares
# the generated schemas of docs/api/aspects with the commit.
# Process requirements: PrR-CXD-026 (Three proposed models in the sldt-semantic-models layout)
# and PrR-CXD-027 (Proposed models validated with SAMM CLI 2.11.1).
name: Model validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  samm:
    name: The validation of the three proposed aspect models
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # The script checks the SHA-256 value of the downloaded tool before each run.
      - name: Download the SAMM command line tool 2.11.1
        run: >-
          bash -c "mkdir -p tools && curl -fsSL -o tools/samm-cli-2.11.1.jar
          https://github.com/eclipse-esmf/esmf-sdk/releases/download/v2.11.1/samm-cli-2.11.1.jar"
      - name: Validate the models and generate the schemas
        run: bash scripts/validate-models.sh --generate
      # The step fails when a generated schema of the commit differs from the output of the tool.
      - name: Compare the generated schemas with the commit
        run: git diff --exit-code -- docs/api/aspects
