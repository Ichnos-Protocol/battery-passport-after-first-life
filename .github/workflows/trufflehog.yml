# Scans the pushed commits for secrets with TruffleHog on every pull request and on every push to the
# branch main, and reports only verified secrets (TRG 8.03 of the Tractus-X Release Guidelines).
name: TruffleHog

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scan:
    name: The TruffleHog scan of the pushed commits
    runs-on: ubuntu-latest
    steps:
      # The scan reads the commits between the base and the head of the event, so the checkout fetches the whole history.
      - name: Check out the repository with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Scan the pushed commits
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          extra_args: --results=verified
