# Runs the CodeQL analysis of the language javascript-typescript on every pull request, on every push
# to the branch main and once a week (TRG 8.01 of the Tractus-X Release Guidelines).
name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Every Monday at 04:30 UTC.
    - cron: "30 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: The CodeQL analysis of javascript-typescript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The analysis uploads its results to the code scanning of the repository.
      security-events: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Run the CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"
