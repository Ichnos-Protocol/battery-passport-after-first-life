# Runs the tests of the reference server with a PostgreSQL 17 service on every pull request and on
# every push to the branch main, and checks the licences of the locked packages.
# Software requirements: SwR-RDB-007 (Dataset writes only by the responsible or an authorised operator)
# and SwR-DATASET-208 (Database trigger refuses a change of a passport's manufacturer).
name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Generates the two passwords of the run. No file of the repository holds a password.
  passwords:
    name: The generated passwords of the test database
    runs-on: ubuntu-latest
    outputs:
      superuser: ${{ steps.generate.outputs.superuser }}
      app-role: ${{ steps.generate.outputs.app-role }}
    steps:
      - name: Generate the two passwords
        id: generate
        run: |
          echo "superuser=$(openssl rand -hex 24)" >> "$GITHUB_OUTPUT"
          echo "app-role=$(openssl rand -hex 24)" >> "$GITHUB_OUTPUT"

  server:
    name: The tests of the reference server
    needs: passwords
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ needs.passwords.outputs.superuser }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:${{ needs.passwords.outputs.superuser }}@localhost:5432/postgres
      TEST_APP_ROLE_PASSWORD: ${{ needs.passwords.outputs.app-role }}
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the packages of the lock file
        run: npm ci
      - name: Check the licences of the locked packages
        run: node ../scripts/check-dependency-licenses.mjs
      - name: Run the tests of the server
        run: npm test
