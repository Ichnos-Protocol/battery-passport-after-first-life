# Runs the checks of the repository on every pull request and on every push to the branch main.
# Process requirements: PrR-CXD-016 (License header of its kind in every reference implementation file)
# and PrR-CXD-017 (Visible NOTICE section at the end of every documentation file).
name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: The checks of the repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The registry check reads the stored PDF file with the command pdftotext of the package poppler-utils.
      - name: Install the package poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      # The line of the runner is the gate for the ten quotes of the stored PDF file.
      - name: Run the registry check
        shell: bash
        run: |
          set -o pipefail
          node scripts/requirements-check.mjs | tee requirements-check.log
          tail -n 1 requirements-check.log | grep -q "^0 problems, 0 quotes skipped"
      - name: Run the source register check
        run: node scripts/check-sources.mjs
      - name: Run the license header check
        run: node scripts/check-license-headers.mjs
      - name: Run the private reference check
        run: node scripts/check-private-references.mjs
      # The argument names the last delivered phase.
      - name: Run the annex check
        run: node scripts/check-annexes.mjs --require P3
      - name: Run the specification check
        run: >-
          node scripts/spec-gate-check.mjs docs/architecture/implementation_plan.md
          --src . --screens-heading "Interfaces" --id-column "Endpoint id" --testid-prefix "EP-"
