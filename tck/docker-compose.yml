# The local deployment of the connector binding of the conformance test kit (section 10.7 of
# docs/architecture/implementation_plan.md): for each of the three participants, one reference server
# built from server/Dockerfile, one database of the server, one connector control plane and one connector
# data plane of Tractus-X EDC 0.13.0, one database of the connector, one secret store and one Digital
# Twin Registry with OAuth2 switched off (decision D77, OAuth2 off in the local registry); and, for the
# three connectors, one wallet stub as their identity (decision D80, One wallet stub for the three
# companies) and one BPN-DID Resolution Service. The servers resolve a receiver from a fixed address
# list (decision D81, A fixed address list in the local deployment only). Process requirement PrR-CXD-029 (Conformance tests
# run against the in-process binding and the connector binding) and decision D43 (One test code and two
# bindings). Every image is a variable of tck/.env.example, and every secret is a local test value of
# tck/.env, which git ignores. The verified values and their public addresses are in tck/README.md.
#
# Start: docker compose -f tck/docker-compose.yml --env-file tck/.env up -d --wait
# Stop:  docker compose -f tck/docker-compose.yml --env-file tck/.env down -v
name: tck

x-healthcheck: &health
  interval: 5s
  timeout: 5s
  retries: 60
  start_period: 10s

# The settings of a control plane and a data plane that are equal for the three participants.
x-connector-environment: &connector-environment
  EDC_IAM_DID_WEB_USE_HTTPS: "false"
  EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS: client-secret
  "EDC_IAM_TRUSTED-ISSUER_0-ISSUER_ID": "did:web:stub%3A8080:BPNL000000000000"
  TX_EDC_IAM_DCP_BDRS_SERVER_URL: http://bdrs:8082/api/directory
  EDC_VAULT_HASHICORP_TOKEN: ${TCK_VAULT_TOKEN:?}
  EDC_DATASOURCE_DEFAULT_USER: postgres
  EDC_DATASOURCE_DEFAULT_PASSWORD: ${TCK_CONNECTOR_DATABASE_PASSWORD:?}
  WEB_HTTP_PORT: "8080"
  WEB_HTTP_PATH: /api
  WEB_HTTP_CONTROL_PORT: "8083"
  WEB_HTTP_CONTROL_PATH: /control
  TX_EDC_DID_SERVICE_SELF_REGISTRATION_ENABLED: "false"
  TX_EDC_DCP_CACHE_ENABLED: "false"

x-control-plane: &control-plane
  image: ${TCK_IMAGE_CONTROL_PLANE:?}
  healthcheck:
    <<: *health
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/check/readiness"]

x-data-plane: &data-plane
  image: ${TCK_IMAGE_DATA_PLANE:?}
  healthcheck:
    <<: *health
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/check/readiness"]

x-connector-database: &connector-database
  image: ${TCK_IMAGE_CONNECTOR_POSTGRES:?}
  environment:
    POSTGRES_PASSWORD: ${TCK_CONNECTOR_DATABASE_PASSWORD:?}
    POSTGRES_DB: edc
  healthcheck:
    <<: *health
    test: ["CMD-SHELL", "pg_isready -U postgres -d edc"]

x-vault: &vault
  image: ${TCK_IMAGE_VAULT:?}
  cap_add: [IPC_LOCK]
  environment:
    VAULT_DEV_ROOT_TOKEN_ID: ${TCK_VAULT_TOKEN:?}
    VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
  healthcheck:
    <<: *health
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health"]

x-stub: &stub
  image: ${TCK_IMAGE_IDENTITY:?}
  healthcheck:
    <<: *health
    test: ["CMD-SHELL", "curl -fs -o /dev/null http://127.0.0.1:8080/actuator/health"]

x-registry: &registry
  image: ${TCK_IMAGE_DTR:?}
  # D77: the chart value registry.authentication false starts the registry with the profile local
  # (sldt-digital-twin-registry v0.13.0, INSTALL.md lines 28 and 38,
  # charts/registry/templates/registry/registry-deployment.yaml lines 45 to 47).
  command: ["--spring.profiles.active=local"]
  restart: on-failure
  healthcheck:
    <<: *health
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4243/actuator/health/readiness"]

x-server-database: &server-database
  image: ${TCK_IMAGE_POSTGRES:?}
  environment:
    POSTGRES_PASSWORD: ${TCK_SERVER_DATABASE_PASSWORD:?}
    POSTGRES_DB: refserver
  healthcheck:
    <<: *health
    test: ["CMD-SHELL", "pg_isready -U postgres -d refserver"]

# One service builds the image of the reference server; the five other services use the built image,
# because six builds of one image tag in parallel fail.
x-server-build: &server-build
  image: tck-reference-server:local
  pull_policy: never

x-server-setup: &server-setup
  <<: *server-build
  command: ["sh", "-c", "node src/db/createAppRoleCli.mjs && node src/db/migrateCli.mjs"]
  restart: "no"

x-server: &server
  <<: *server-build
  healthcheck:
    <<: *health
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))"]

# The environment of a reference server that is equal for the three participants.
x-server-environment: &server-environment
  OWN_ADDRESS: '{"NationalCode":[{"en":"XX"}],"CityTown":[{"en":"Example City"}],"Street":[{"en":"Example Street 1"}],"ZipCode":[{"en":"00000"}]}'
  DATABASE_SCHEMA: ${DATABASE_SCHEMA:-tck000}
  PORT: "8080"
  BINDING: connector
  OPERATOR_TOKEN_SECRET: ${TCK_OPERATOR_TOKEN_SECRET:?}
  DATA_PLANE_KEY_HEADER: x-api-key
  PARTNER_BPN_HEADER: Edc-Bpn
  ACCESS_REGIME: ${ACCESS_REGIME:-after-act}
  PASSPORT_SERVICE_PROVIDER_BPNL: ${PASSPORT_SERVICE_PROVIDER_BPNL:-}
  EDC_MANAGEMENT_API_KEY: ${TCK_EDC_MANAGEMENT_API_KEY:?}
  EDC_MANAGEMENT_API_KEY_HEADER: x-api-key
  LOG_LEVEL: ${TCK_SERVER_LOG_LEVEL:-info}
  # D81: the Dataspace Protocol address and the decentralised identifier of each connector.
  RECEIVER_RESOLUTION: address-list
  RECEIVER_ADDRESS_LIST: '{"BPNL00000000TCK1":{"connectorUrl":"http://cp-1:8084/api/v1/dsp/2025-1","did":"did:web:stub%3A8080:BPNL00000000TCK1"},"BPNL00000000TCK2":{"connectorUrl":"http://cp-2:8084/api/v1/dsp/2025-1","did":"did:web:stub%3A8080:BPNL00000000TCK2"},"BPNL00000000TCK3":{"connectorUrl":"http://cp-3:8084/api/v1/dsp/2025-1","did":"did:web:stub%3A8080:BPNL00000000TCK3"}}'

services:
  # The BPN-DID Resolution Service of the three connectors (bdrs-server-memory, tag 0.6.0). The directory
  # API answers a caller that presents a Membership Credential of a trusted issuer.
  bdrs:
    image: ${TCK_IMAGE_BPN_DID:?}
    environment:
      WEB_HTTP_PORT: "8080"
      WEB_HTTP_PATH: /api
      WEB_HTTP_MANAGEMENT_PORT: "8081"
      WEB_HTTP_MANAGEMENT_PATH: /api/management
      WEB_HTTP_MANAGEMENT_AUTH_TYPE: tokenbased
      WEB_HTTP_MANAGEMENT_AUTH_KEY: ${TCK_BDRS_MANAGEMENT_API_KEY:?}
      WEB_HTTP_DIRECTORY_PORT: "8082"
      WEB_HTTP_DIRECTORY_PATH: /api/directory
      EDC_IAM_ISSUER_ID: "required but not really needed"
      "EDC_IAM_TRUSTED-ISSUER_0-ISSUER_ID": "did:web:stub%3A8080:BPNL000000000000"
      EDC_IAM_DID_WEB_USE_HTTPS: "false"
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://127.0.0.1:8080/api/check/readiness"]

  # One run after the start: the client secret and the token keys of each connector in its secret store,
  # and the mapping of each Business Partner Number to the decentralised identifier of its connector in
  # the BPN-DID Resolution Service. Every value is generated or a local test value.
  seed:
    image: ${TCK_IMAGE_NODE:?}
    restart: "no"
    environment:
      TCK_VAULT_TOKEN: ${TCK_VAULT_TOKEN:?}
      TCK_BDRS_MANAGEMENT_API_KEY: ${TCK_BDRS_MANAGEMENT_API_KEY:?}
    depends_on:
      vault-1: { condition: service_healthy }
      vault-2: { condition: service_healthy }
      vault-3: { condition: service_healthy }
      bdrs: { condition: service_healthy }
      stub: { condition: service_healthy }
    command:
      - node
      - -e
      - |
        const { generateKeyPairSync } = require("node:crypto");
        const env = process.env;
        const check = async (answer, what) => { if (!answer.ok) throw new Error(what + " answered " + answer.status + " " + (await answer.text())); };
        (async () => {
          for (const n of [1, 2, 3]) {
            const bpnl = "BPNL00000000TCK" + n;
            const { privateKey, publicKey } = generateKeyPairSync("ec", { namedCurve: "P-256" });
            const secrets = {
              "client-secret": bpnl,
              "key-1": privateKey.export({ type: "pkcs8", format: "pem" }),
              "key-1-public": publicKey.export({ type: "spki", format: "pem" }),
            };
            for (const [alias, content] of Object.entries(secrets)) {
              const answer = await fetch("http://vault-" + n + ":8200/v1/secret/data/" + alias, { method: "POST", headers: { "X-Vault-Token": env.TCK_VAULT_TOKEN, "content-type": "application/json" }, body: JSON.stringify({ data: { content } }) });
              await check(answer, "vault-" + n + " " + alias);
            }
            const did = "did:web:stub%3A8080:" + bpnl;
            const mapping = await fetch("http://bdrs:8081/api/management/bpn-directory", { method: "POST", headers: { "x-api-key": env.TCK_BDRS_MANAGEMENT_API_KEY, "content-type": "application/json" }, body: JSON.stringify({ bpn: bpnl, did }) });
            if (mapping.status !== 204 && mapping.status !== 200 && mapping.status !== 409) await check(mapping, "bdrs " + bpnl);
            console.log("seeded " + bpnl + " " + did);
          }
        })().catch((error) => { console.error(error.message); process.exit(1); });

  # Participant 1: the data provider of the original passports, BPNL00000000TCK1.
  vault-1: *vault
  # The one wallet stub of the three connectors (D80): one issuer and the wallets of the three companies.
  stub:
    <<: *stub
    environment:
      STUB_ENV: local
      BASE_WALLET_BPN: BPNL000000000000
      SEED_WALLETS_BPN: BPNL00000000TCK1,BPNL00000000TCK2,BPNL00000000TCK3
      DID_HOST: stub%3A8080
      STUB_URL: http://stub:8080
      PORTAL_WAIT_TIME: "86400"
      APP_LOG_LEVEL: INFO
  edc-db-1: *connector-database
  cp-1:
    <<: *control-plane
    depends_on:
      edc-db-1: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
    environment:
      <<: *connector-environment
      EDC_PARTICIPANT_ID: "did:web:stub%3A8080:BPNL00000000TCK1"
      EDC_IAM_ISSUER_ID: "did:web:stub%3A8080:BPNL00000000TCK1"
      EDC_PARTICIPANT_CONTEXT_ID: participant-tck1
      TRACTUSX_EDC_PARTICIPANT_BPN: BPNL00000000TCK1
      EDC_RUNTIME_ID: cp-1
      EDC_IAM_STS_OAUTH_TOKEN_URL: http://stub:8080/oauth/token
      EDC_IAM_STS_OAUTH_CLIENT_ID: BPNL00000000TCK1
      TX_EDC_IAM_STS_DIV_URL: http://stub:8080/api/sts
      EDC_VAULT_HASHICORP_URL: http://vault-1:8200
      EDC_DATASOURCE_DEFAULT_URL: jdbc:postgresql://edc-db-1:5432/edc
      WEB_HTTP_MANAGEMENT_PORT: "8081"
      WEB_HTTP_MANAGEMENT_PATH: /management
      WEB_HTTP_MANAGEMENT_AUTH_TYPE: tokenbased
      WEB_HTTP_MANAGEMENT_AUTH_KEY: ${TCK_EDC_MANAGEMENT_API_KEY:?}
      WEB_HTTP_PROTOCOL_PORT: "8084"
      WEB_HTTP_PROTOCOL_PATH: /api/v1/dsp
      EDC_CONTROL_ENDPOINT: http://cp-1:8083/control
      EDC_DSP_CALLBACK_ADDRESS: http://cp-1:8084/api/v1/dsp
  dp-1:
    <<: *data-plane
    depends_on:
      cp-1: { condition: service_healthy }
    environment:
      <<: *connector-environment
      EDC_PARTICIPANT_ID: "did:web:stub%3A8080:BPNL00000000TCK1"
      EDC_IAM_ISSUER_ID: "did:web:stub%3A8080:BPNL00000000TCK1"
      EDC_PARTICIPANT_CONTEXT_ID: participant-tck1
      EDC_RUNTIME_ID: dp-1
      EDC_IAM_STS_OAUTH_TOKEN_URL: http://stub:8080/oauth/token
      EDC_IAM_STS_OAUTH_CLIENT_ID: BPNL00000000TCK1
      TX_EDC_IAM_STS_DIV_URL: http://stub:8080/api/sts
      EDC_VAULT_HASHICORP_URL: http://vault-1:8200
      EDC_DATASOURCE_DEFAULT_URL: jdbc:postgresql://edc-db-1:5432/edc
      WEB_HTTP_PUBLIC_PORT: "8081"
      WEB_HTTP_PUBLIC_PATH: /api/public
      EDC_CONTROL_ENDPOINT: http://dp-1:8083/control
      EDC_DPF_SELECTOR_URL: http://cp-1:8083/control/v1/dataplanes
      EDC_DATAPLANE_API_PUBLIC_BASEURL: http://dp-1:8081/api/public
      EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS: key-1
      EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS: key-1-public
      TX_EDC_DPF_CONSUMER_PROXY_AUTH_APIKEY: ${TCK_EDC_MANAGEMENT_API_KEY:?}
  dtr-1:
    <<: *registry
    depends_on:
      server-db-1: { condition: service_healthy }
    environment:
      # The profile local names an H2 database, whose driver the image does not hold, so the registry
      # uses the database postgres of the database server of the participant.
      # The owning tenant reads every shell; the client names it in the header Edc-Bpn.
      REGISTRY_IDM_OWNINGTENANTID: BPNL00000000TCK1
      SPRING_DATASOURCE_URL: jdbc:postgresql://server-db-1:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${TCK_SERVER_DATABASE_PASSWORD:?}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_SQL_INIT_PLATFORM: pg
  server-db-1: *server-database
  server-setup-1:
    <<: *server-setup
    build:
      context: ..
      dockerfile: server/Dockerfile
    pull_policy: build
    depends_on:
      server-db-1: { condition: service_healthy }
    environment:
      DATABASE_MIGRATION_URL: postgres://postgres:${TCK_SERVER_DATABASE_PASSWORD:?}@server-db-1:5432/refserver
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-tck000}
      APP_ROLE_PASSWORD: ${TCK_APP_ROLE_PASSWORD:?}
  server-1:
    <<: *server
    depends_on:
      server-setup-1: { condition: service_completed_successfully }
      cp-1: { condition: service_healthy }
      dp-1: { condition: service_healthy }
      dtr-1: { condition: service_healthy }
    environment:
      <<: *server-environment
      OWN_BPNL: BPNL00000000TCK1
      OWN_LEGAL_NAME: Example Company TCK1
      DATABASE_URL: postgres://refserver_app:${TCK_APP_ROLE_PASSWORD:?}@server-db-1:5432/refserver
      PUBLIC_BASE_URL: http://server-1:8080
      DATA_PLANE_KEY: ${TCK_DATA_PLANE_KEY_1:?}
      CONNECTOR_DATA_PLANE_PUBLIC_URL: http://dp-1:8081/api/public
      CONNECTOR_DSP_URL: http://cp-1:8084/api/v1/dsp
      EDC_MANAGEMENT_URL: http://cp-1:8081/management
      DTR_URL: http://dtr-1:4243/api/v3

  # Participant 2: the second-life operator, BPNL00000000TCK2.
  vault-2: *vault
  edc-db-2: *connector-database
  cp-2:
    <<: *control-plane
    depends_on:
      edc-db-2: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
    environment:
      <<: *connector-environment
      EDC_PARTICIPANT_ID: "did:web:stub%3A8080:BPNL00000000TCK2"
      EDC_IAM_ISSUER_ID: "did:web:stub%3A8080:BPNL00000000TCK2"
      EDC_PARTICIPANT_CONTEXT_ID: participant-tck2
      TRACTUSX_EDC_PARTICIPANT_BPN: BPNL00000000TCK2
      EDC_RUNTIME_ID: cp-2
      EDC_IAM_STS_OAUTH_TOKEN_URL: http://stub:8080/oauth/token
      EDC_IAM_STS_OAUTH_CLIENT_ID: BPNL00000000TCK2
      TX_EDC_IAM_STS_DIV_URL: http://stub:8080/api/sts
      EDC_VAULT_HASHICORP_URL: http://vault-2:8200
      EDC_DATASOURCE_DEFAULT_URL: jdbc:postgresql://edc-db-2:5432/edc
      WEB_HTTP_MANAGEMENT_PORT: "8081"
      WEB_HTTP_MANAGEMENT_PATH: /management
      WEB_HTTP_MANAGEMENT_AUTH_TYPE: tokenbased
      WEB_HTTP_MANAGEMENT_AUTH_KEY: ${TCK_EDC_MANAGEMENT_API_KEY:?}
      WEB_HTTP_PROTOCOL_PORT: "8084"
      WEB_HTTP_PROTOCOL_PATH: /api/v1/dsp
      EDC_CONTROL_ENDPOINT: http://cp-2:8083/control
      EDC_DSP_CALLBACK_ADDRESS: http://cp-2:8084/api/v1/dsp
  dp-2:
    <<: *data-plane
    depends_on:
      cp-2: { condition: service_healthy }
    environment:
      <<: *connector-environment
      EDC_PARTICIPANT_ID: "did:web:stub%3A8080:BPNL00000000TCK2"
      EDC_IAM_ISSUER_ID: "did:web:stub%3A8080:BPNL00000000TCK2"
      EDC_PARTICIPANT_CONTEXT_ID: participant-tck2
      EDC_RUNTIME_ID: dp-2
      EDC_IAM_STS_OAUTH_TOKEN_URL: http://stub:8080/oauth/token
      EDC_IAM_STS_OAUTH_CLIENT_ID: BPNL00000000TCK2
      TX_EDC_IAM_STS_DIV_URL: http://stub:8080/api/sts
      EDC_VAULT_HASHICORP_URL: http://vault-2:8200
      EDC_DATASOURCE_DEFAULT_URL: jdbc:postgresql://edc-db-2:5432/edc
      WEB_HTTP_PUBLIC_PORT: "8081"
      WEB_HTTP_PUBLIC_PATH: /api/public
      EDC_CONTROL_ENDPOINT: http://dp-2:8083/control
      EDC_DPF_SELECTOR_URL: http://cp-2:8083/control/v1/dataplanes
      EDC_DATAPLANE_API_PUBLIC_BASEURL: http://dp-2:8081/api/public
      EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS: key-1
      EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS: key-1-public
      TX_EDC_DPF_CONSUMER_PROXY_AUTH_APIKEY: ${TCK_EDC_MANAGEMENT_API_KEY:?}
  dtr-2:
    <<: *registry
    depends_on:
      server-db-2: { condition: service_healthy }
    environment:
      # The profile local names an H2 database, whose driver the image does not hold, so the registry
      # uses the database postgres of the database server of the participant.
      # The owning tenant reads every shell; the client names it in the header Edc-Bpn.
      REGISTRY_IDM_OWNINGTENANTID: BPNL00000000TCK2
      SPRING_DATASOURCE_URL: jdbc:postgresql://server-db-2:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${TCK_SERVER_DATABASE_PASSWORD:?}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_SQL_INIT_PLATFORM: pg
  server-db-2: *server-database
  server-setup-2:
    <<: *server-setup
    depends_on:
      server-db-2: { condition: service_healthy }
    environment:
      DATABASE_MIGRATION_URL: postgres://postgres:${TCK_SERVER_DATABASE_PASSWORD:?}@server-db-2:5432/refserver
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-tck000}
      APP_ROLE_PASSWORD: ${TCK_APP_ROLE_PASSWORD:?}
  server-2:
    <<: *server
    depends_on:
      server-setup-2: { condition: service_completed_successfully }
      cp-2: { condition: service_healthy }
      dp-2: { condition: service_healthy }
      dtr-2: { condition: service_healthy }
    environment:
      <<: *server-environment
      OWN_BPNL: BPNL00000000TCK2
      OWN_LEGAL_NAME: Example Company TCK2
      DATABASE_URL: postgres://refserver_app:${TCK_APP_ROLE_PASSWORD:?}@server-db-2:5432/refserver
      PUBLIC_BASE_URL: http://server-2:8080
      DATA_PLANE_KEY: ${TCK_DATA_PLANE_KEY_2:?}
      CONNECTOR_DATA_PLANE_PUBLIC_URL: http://dp-2:8081/api/public
      CONNECTOR_DSP_URL: http://cp-2:8084/api/v1/dsp
      EDC_MANAGEMENT_URL: http://cp-2:8081/management
      DTR_URL: http://dtr-2:4243/api/v3

  # Participant 3: the recycler, the repairer and the waste receiver, BPNL00000000TCK3.
  vault-3: *vault
  edc-db-3: *connector-database
  cp-3:
    <<: *control-plane
    depends_on:
      edc-db-3: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
    environment:
      <<: *connector-environment
      EDC_PARTICIPANT_ID: "did:web:stub%3A8080:BPNL00000000TCK3"
      EDC_IAM_ISSUER_ID: "did:web:stub%3A8080:BPNL00000000TCK3"
      EDC_PARTICIPANT_CONTEXT_ID: participant-tck3
      TRACTUSX_EDC_PARTICIPANT_BPN: BPNL00000000TCK3
      EDC_RUNTIME_ID: cp-3
      EDC_IAM_STS_OAUTH_TOKEN_URL: http://stub:8080/oauth/token
      EDC_IAM_STS_OAUTH_CLIENT_ID: BPNL00000000TCK3
      TX_EDC_IAM_STS_DIV_URL: http://stub:8080/api/sts
      EDC_VAULT_HASHICORP_URL: http://vault-3:8200
      EDC_DATASOURCE_DEFAULT_URL: jdbc:postgresql://edc-db-3:5432/edc
      WEB_HTTP_MANAGEMENT_PORT: "8081"
      WEB_HTTP_MANAGEMENT_PATH: /management
      WEB_HTTP_MANAGEMENT_AUTH_TYPE: tokenbased
      WEB_HTTP_MANAGEMENT_AUTH_KEY: ${TCK_EDC_MANAGEMENT_API_KEY:?}
      WEB_HTTP_PROTOCOL_PORT: "8084"
      WEB_HTTP_PROTOCOL_PATH: /api/v1/dsp
      EDC_CONTROL_ENDPOINT: http://cp-3:8083/control
      EDC_DSP_CALLBACK_ADDRESS: http://cp-3:8084/api/v1/dsp
  dp-3:
    <<: *data-plane
    depends_on:
      cp-3: { condition: service_healthy }
    environment:
      <<: *connector-environment
      EDC_PARTICIPANT_ID: "did:web:stub%3A8080:BPNL00000000TCK3"
      EDC_IAM_ISSUER_ID: "did:web:stub%3A8080:BPNL00000000TCK3"
      EDC_PARTICIPANT_CONTEXT_ID: participant-tck3
      EDC_RUNTIME_ID: dp-3
